name: UGent Press Tracker

on:
  schedule:
    # Runs at 06:00, 12:00, 16:00, and 20:00 UTC
    # Matches 8u, 14u, 18u, 22u CEST (Summer)
    - cron: '0 6,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for rebasing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai

      - name: Execute scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          
          # Only commit if the scraper actually changed the file
          if ! git diff --staged --quiet; then
            git commit -m "chore: update press status [skip ci]"
            # Pull with rebase prevents push rejections if code was changed manually
            git pull --rebase origin main
            git push
          fi